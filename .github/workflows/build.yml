name: Build Docker Image and Export as tar

on:
  workflow_dispatch:
    inputs:
      dockerfile_dir:
        description: "Dockerfile이 있는 디렉터리 경로"
        required: true
        default: "11/jre/debian"
      image_name:
        description: "이미지 이름"
        required: true
        default: "azul-zulu"
      image_tag:
        description: "이미지 태그"
        required: true
        default: "11-jre"
  # push 시 자동 실행이 필요하면 아래 주석을 해제하세요
  # push:
  #   branches: [ main ]
  #   paths:
  #     - "path/to/dir/**"

env:
  DOCKERFILE_DIR: ${{ github.event.inputs.dockerfile_dir || 'path/to/dir' }}
  IMAGE_NAME: ${{ github.event.inputs.image_name || 'my-image' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and export as tar
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKERFILE_DIR }}
          file: ${{ env.DOCKERFILE_DIR }}/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar

      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}
          path: /tmp/${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          retention-days: 7
